name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Directory
        id: locate
        run: |
          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
            echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gujarati-Ghazal-Checker-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30